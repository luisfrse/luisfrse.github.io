<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de epidemias · Luis Franco Serrano</title>
<meta name="description" content="Simulador interactivo de epidemias e inmunidad de grupo con virus reales, vacunas, medidas de control y mapas de Mataró, Barcelona, Catalunya, España, Europa y el mundo. Funciona en el navegador.">
<meta name="theme-color" content="#0d1a2a">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="epidemias.css">
</head>
<body>
<main class="kit-main" id="app">
<div class="epi-layout">

  <!-- Lugar, patógeno y ficha -->
  <section class="panel intro epi-intro">
    <div class="intro-text">
      <h2 data-i18n="intro_h"></h2>
      <p class="muted" data-i18n="intro_p"></p>
    </div>
    <div class="pick"><span class="pick-l" data-i18n="place_l"></span><div class="scen-chips" id="place-chips" role="group" data-i18n-aria="place_l"></div></div>
    <div class="pick"><span class="pick-l" data-i18n="pathogen_l"></span><div class="scen-chips pgroups" id="scen-chips" role="group" data-i18n-aria="pathogen_l"></div></div>
    <article class="scen-card" id="scen-card" aria-live="polite"></article>
    <div class="banner challenge-banner" id="challenge-banner" hidden></div>
  </section>

  <!-- Simulación y gráficos: columna fija a un lado mientras se ajustan los parámetros -->
  <section class="epi-live" aria-label="Simulación">
    <div class="panel world-panel">
      <div class="world-head">
        <h2 data-i18n="world_h"></h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="world-wrap">
        <canvas id="world" role="img" tabindex="0"></canvas>
        <div class="world-msg" id="world-msg" hidden></div>
      </div>
      <p class="small muted ratio" id="ratio"></p>
      <p class="small map-info" id="map-info" hidden></p>
      <div class="toolbar">
        <button class="btn" id="btn-play" type="button"></button>
        <button class="btn ghost" id="btn-step" type="button" data-i18n="btn_step"></button>
        <button class="btn ghost" id="btn-week" type="button" data-i18n="btn_week"></button>
        <button class="btn ghost" id="btn-reset" type="button" data-i18n="btn_reset"></button>
      </div>
      <div class="row opts">
        <span class="small muted" data-i18n="speed_l"></span>
        <div class="seg" id="speed" role="group" data-i18n-aria="speed_l"></div>
        <label class="check"><input type="checkbox" id="opt-radius"><span data-i18n="opt_radius"></span></label>
        <label class="check"><input type="checkbox" id="opt-live"><span data-i18n="opt_live"></span></label>
      </div>
      <p class="muted small" data-i18n="click_hint"></p>
    </div>

    <div class="panel charts-panel">
      <div class="stats" id="stats"></div>
      <div class="chart-block">
        <h3 id="t-stack"></h3>
        <canvas id="cv-stack" role="img" tabindex="0"></canvas>
        <p class="readout" id="readout"></p>
      </div>
      <div class="chart-block">
        <h3 id="t-inc"></h3>
        <canvas id="cv-inc" role="img"></canvas>
        <div class="row opts">
          <label class="check"><input type="checkbox" id="opt-seir"><span data-i18n="opt_seir"></span></label>
          <label class="check"><input type="checkbox" id="opt-cf"><span data-i18n="opt_cf"></span></label>
        </div>
        <div class="legend key" id="inc-key"></div>
      </div>
      <div class="row chart-actions">
        <button class="btn ghost small" id="btn-ref" type="button"></button>
        <button class="btn ghost small" id="btn-csv" type="button" data-i18n="btn_csv"></button>
        <button class="btn ghost small" id="btn-png" type="button" data-i18n="btn_png"></button>
        <button class="btn ghost small" id="btn-share" type="button" data-i18n="btn_share"></button>
      </div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </div>
  </section>

  <div class="epi-rest">

  <!-- Cifras absolutas y capacidad asistencial -->
  <section class="panel">
    <h2 data-i18n="res_h"></h2>
    <div id="results"></div>
  </section>

  <!-- Medidas de control -->
  <section class="panel" id="measures-panel">
    <h2 data-i18n="measures_h"></h2>
    <p class="muted" data-i18n="measures_p"></p>
    <div id="measures"></div>
  </section>

  <!-- Vacunas -->
  <section class="panel" id="vaccines-panel">
    <h2 data-i18n="vaccines_h"></h2>
    <p class="muted" data-i18n="vaccines_p"></p>
    <div id="vaccines"></div>
  </section>

  <!-- Mapa: origen y movilidad -->
  <section class="panel" id="map-panel" hidden>
    <h2 data-i18n="map_h"></h2>
    <div id="map-side"></div>
  </section>

  <!-- Parámetros -->
  <section class="panel" id="controls-panel">
    <div class="row spread">
      <h2 data-i18n="ctl_h"></h2>
      <button class="btn small" id="btn-apply" type="button" hidden data-i18n="apply"></button>
    </div>
    <div class="banner" id="dirty" hidden data-i18n="dirty"></div>
    <div class="ctl-grid" id="controls"></div>
  </section>

  <!-- Retos -->
  <section class="panel" id="challenges-panel">
    <h2 data-i18n="chal_h"></h2>
    <p class="muted" data-i18n="chal_p"></p>
    <div class="grid cols-2" id="challenges"></div>
  </section>

  <!-- Qué estás viendo y créditos -->
  <section class="panel explain" id="explain"><div id="explain-body"></div>
    <details class="credits"><summary data-i18n="cr_h"></summary><div id="credits"></div></details>
  </section>
  </div>
</div>
</main>

<script src="../shared/app.js"></script>
<script src="texts.js"></script>
<script src="core.js"></script>
<script src="sim.js"></script>
<script src="mapa.js"></script>
<script src="meta.js"></script>
<script src="panels.js"></script>
<script src="app.js"></script>
</body>
</html>
