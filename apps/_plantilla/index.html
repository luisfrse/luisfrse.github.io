<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantilla · Luis Franco Serrano</title>
<meta name="description" content="Plantilla de aplicación.">
<meta name="theme-color" content="#0d1a2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app.css">
<style>
/* estilos propios de esta aplicación */
</style>
</head>
<body>
<main class="kit-main" id="app"></main>

<script src="../shared/app.js"></script>
<script>
(() => {
  const t = AppKit.i18n({
    es: { title: 'Plantilla', hello: 'Hola, {name}' },
    ca: { title: 'Plantilla', hello: 'Hola, {name}' },
    en: { title: 'Template', hello: 'Hello, {name}' }
  });
  AppKit.mount({ titleKey: 'title' });
  const render = () => { document.getElementById('app').innerHTML = `<section class="panel"><h2>${AppKit.esc(t('hello', { name: 'mundo' }))}</h2></section>`; document.title = t('title') + ' · Luis Franco Serrano'; };
  AppKit.onLang(render); render();
})();
</script>
</body>
</html>
