<!doctype html><meta charset="utf-8"><pre id="out"></pre>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms)); const out=[];
(async()=>{
 const f=document.createElement('iframe'); f.style.cssText='width:1200px;height:900px;border:0'; f.src='index.html'; document.body.appendChild(f);
 await w(2000); const D=f.contentDocument, $=s=>D.querySelector(s);
 $('.mode[data-mode="quiz"]').click(); await w(900);
 $('#q-quit').click(); await w(400);
 const dlg=D.querySelector('dialog'); const b=dlg.querySelector('[data-r="1"]');
 let seen=[]; dlg.addEventListener('click',e=>seen.push('click en '+e.target.tagName+' r='+(e.target.dataset||{}).r),true); dlg.addEventListener('close',()=>seen.push('close rv='+dlg.returnValue));
 b.click(); await w(500);
 out.push('eventos tras b.click(): '+seen.join(' ; ')+' | abierto='+dlg.open+' | conectado='+dlg.isConnected);
 if(dlg.isConnected){ dlg.close('1'); await w(500); out.push('tras close(1): conectado='+dlg.isConnected+' hero='+!!$('.hero')+' eventos='+seen.join(' ; ')); }
 document.getElementById('out').textContent=out.join('\n');
})();
</script>
