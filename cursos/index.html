<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos online · Luis Franco Serrano</title>
<meta name="description" content="Cursos online en castellano y catalán: oposiciones TCAE, oposiciones de Procedimientos Sanitarios y Asistenciales, primeros auxilios y supervivencia en emergencias.">
<meta name="theme-color" content="#0d1a2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#14212b;--soft:#4a5b68;--paper:#f5f4f8;--card:#fff;--line:#e1dfe8;--night:#0d1a2a;--deep:#1c3a5c;--sea:#3b6ea5;--accent:#b08be0;--accent-ink:#5a2d86;--radius:16px;
--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6;font-size:1.05rem;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--sea)}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0 0 .5em;letter-spacing:-.015em}
.top{background:var(--night);color:#fff;position:sticky;top:0;z-index:10}
.top-in{width:min(1100px,100% - 32px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--head);font-weight:700}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--night);font-size:.9rem}
.lang{display:flex;gap:2px;padding:3px;border-radius:99px;background:rgba(255,255,255,.1)}
.lang button{border:0;background:none;color:#cfd6df;font:600 .9rem var(--body);min-width:40px;min-height:34px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--night)}
.hero{background:linear-gradient(135deg,#0d1a2a,#2a2060);color:#fff;padding:54px 0 46px}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
.hero h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:.35em}
.hero p{max-width:60ch;color:#d6dbe6;font-size:1.15rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:.95rem;text-decoration:none}
main{padding:34px 0 20px}
.course{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 28px;overflow:hidden;scroll-margin-top:70px}
.c-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.pics{background:var(--night);padding:14px;display:grid;gap:10px;align-content:start}
.pics a{display:block;border-radius:10px;overflow:hidden}
.pics img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.body{padding:26px 28px}
.body h2{font-size:1.7rem}
.lead{color:var(--soft);margin-bottom:.9em}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.price b{font-family:var(--head);font-size:2rem;color:var(--accent-ink)}
.price span{color:var(--soft);font-size:.95rem}
ul.inc{list-style:none;padding:0;margin:0 0 14px}
ul.inc li{position:relative;padding-left:26px;margin:0 0 .45em}
ul.inc li::before{content:"✓";position:absolute;left:0;color:var(--accent-ink);font-weight:700}
.not{background:#f4f1fa;border-radius:10px;padding:12px 14px;font-size:.95rem;color:var(--soft);margin:0 0 16px}
.not b{color:var(--ink)}
.btn{display:inline-block;background:var(--accent-ink);color:#fff;text-decoration:none;font-weight:700;padding:13px 26px;border-radius:99px}
.btn:hover{background:#431f66}
.btn.ghost{background:transparent;color:var(--accent-ink);border:2px solid var(--accent-ink);padding:11px 22px}
.btn.ghost:hover{background:#efe9f8}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;margin:0 0 28px}
.how h2{font-size:1.4rem}
.how ul{margin:0;padding-left:1.2em}
footer{padding:10px 0 40px;text-align:center;color:var(--soft);font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
@media (max-width:820px){.c-grid{grid-template-columns:1fr}.body{padding:20px 18px}.hero{padding:40px 0 34px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="../#/inicio"><span class="mark">LF</span><span>Luis Franco Serrano</span></a>
  <div class="lang" role="group" aria-label="Idioma">
    <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
    <button type="button" data-lang="ca" aria-pressed="false" lang="ca">CA</button>
  </div>
</div></header>

<section class="hero"><div class="wrap">
  <h1 id="h1"></h1>
  <p id="lead"></p>
  <div class="chips" id="chips"></div>
</div></section>

<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="cursos-data.js"></script>
<script>
(() => {
  'use strict';
  const T = {
    es: {
      title: 'Cursos online', lead: 'Material de estudio elaborado por un docente, con acceso online a mi campus, en castellano y catalán, desde el móvil o el ordenador.',
      price: 'Precio', access: '1 año de acceso desde la activación, ampliable', not: 'Lo que no es', contact: 'Pedir información o acceso',
      how: 'Cómo funciona', foot: '© Luis Franco Serrano', preview: 'Ver la parte abierta del curso', full: 'Ver el curso completo',
      howList: ['Escríbeme por el formulario de contacto y te cuento cómo acceder.', 'Te doy de alta una cuenta personal en el campus (campus.luisfs.com) y recibes tu acceso.', 'Entras desde el móvil o el ordenador, sin instalar nada. Puedes cambiar entre castellano y catalán con un botón.', 'El acceso dura 1 año desde la activación y se puede ampliar.']
    },
    ca: {
      title: 'Cursos en línia', lead: 'Material d’estudi elaborat per un docent, amb accés en línia al meu campus, en castellà i català, des del mòbil o l’ordinador.',
      price: 'Preu', access: '1 any d’accés des de l’activació, ampliable', not: 'El que no és', contact: 'Demanar informació o accés',
      how: 'Com funciona', foot: '© Luis Franco Serrano', preview: 'Veure la part oberta del curs', full: 'Veure el curs complet',
      howList: ['Escriu-me pel formulari de contacte i t’explico com accedir-hi.', 'Et dono d’alta un compte personal al campus (campus.luisfs.com) i rebràs el teu accés.', 'Hi entres des del mòbil o l’ordinador, sense instal·lar res. Pots canviar entre castellà i català amb un botó.', 'L’accés dura 1 any des de l’activació i es pot ampliar.']
    }
  };
  const C = window.CURSOS;
  let lang = 'es';
  try { const s = localStorage.getItem('lang'); if (s === 'ca' || s === 'es') lang = s; else if ((navigator.language || '').toLowerCase().startsWith('ca')) lang = 'ca'; } catch (_) {}
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title + ' · Luis Franco Serrano';
    $('h1').textContent = t.title; $('lead').textContent = t.lead;
    $('chips').innerHTML = C.map((c) => `<a class="chip" href="#${c.id}">${esc(c[lang].name)}</a>`).join('');
    $('app').innerHTML = C.map((c) => {
      const d = c[lang];
      return `<article class="course" id="${c.id}"><div class="c-grid">
        <div class="pics">
          <a href="img/${c.img}-1.jpg" target="_blank" rel="noopener"><img src="img/${c.img}-1.jpg" alt="${esc(d.name)}" width="1080" height="1080" loading="lazy"></a>
          <div class="thumbs">
            <a href="img/${c.img}-2.jpg" target="_blank" rel="noopener"><img src="img/${c.img}-2.jpg" alt="" width="1080" height="1080" loading="lazy"></a>
            <a href="img/${c.img}-3.jpg" target="_blank" rel="noopener"><img src="img/${c.img}-3.jpg" alt="" width="1080" height="1080" loading="lazy"></a>
          </div>
        </div>
        <div class="body">
          <h2>${esc(d.name)}</h2>
          <p class="lead">${esc(d.lead)}</p>
          <div class="price"><b>${c.price} €</b><span>${esc(t.access)}</span></div>
          <ul class="inc">${d.inc.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          <div class="acts"><a class="btn" href="${c.page}/">${esc(t.full)}</a><a class="btn ghost" href="../#/contacto">${esc(t.contact)}</a><a class="btn ghost" href="https://campus.luisfs.com/asignatura/${c.slug}" target="_blank" rel="noopener">${esc(t.preview)}</a>${c.app ? `<a class="btn ghost" href="${c.app.url}" target="_blank" rel="noopener">${esc(c.app[lang])}</a>` : ''}</div>
        </div></div></article>`;
    }).join('') + `<section class="how"><h2>${esc(t.how)}</h2><ul>${t.howList.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
    $('foot').textContent = t.foot;
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }
  document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (_) {} render();
  }));
  render();
})();
</script>
</body>
</html>
