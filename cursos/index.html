<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos online · Luis Franco Serrano</title>
<meta name="description" content="Cursos online en castellano y catalán: oposiciones TCAE, oposiciones de Procedimientos Sanitarios y Asistenciales, primeros auxilios y supervivencia en emergencias.">
<meta name="theme-color" content="#0d1a2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#14212b;--soft:#4a5b68;--paper:#f5f4f8;--card:#fff;--line:#e1dfe8;--night:#0d1a2a;--deep:#1c3a5c;--sea:#3b6ea5;--accent:#b08be0;--accent-ink:#5a2d86;--radius:16px;
--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6;font-size:1.05rem;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--sea)}
h1,h2,h3{font-family:var(--head);line-height:1.12;margin:0 0 .5em;letter-spacing:-.015em}
.top{background:var(--night);color:#fff;position:sticky;top:0;z-index:10}
.top-in{width:min(1100px,100% - 32px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--head);font-weight:700}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--night);font-size:.9rem}
.lang{display:flex;gap:2px;padding:3px;border-radius:99px;background:rgba(255,255,255,.1)}
.lang button{border:0;background:none;color:#cfd6df;font:600 .9rem var(--body);min-width:40px;min-height:34px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--night)}
.hero{background:linear-gradient(135deg,#0d1a2a,#2a2060);color:#fff;padding:54px 0 46px}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
.hero h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:.35em}
.hero p{max-width:60ch;color:#d6dbe6;font-size:1.15rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:.95rem;text-decoration:none}
main{padding:34px 0 20px}
.course{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 28px;overflow:hidden;scroll-margin-top:70px}
.c-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.pics{background:var(--night);padding:14px;display:grid;gap:10px;align-content:start}
.pics a{display:block;border-radius:10px;overflow:hidden}
.pics img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.body{padding:26px 28px}
.body h2{font-size:1.7rem}
.lead{color:var(--soft);margin-bottom:.9em}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.price b{font-family:var(--head);font-size:2rem;color:var(--accent-ink)}
.price span{color:var(--soft);font-size:.95rem}
ul.inc{list-style:none;padding:0;margin:0 0 14px}
ul.inc li{position:relative;padding-left:26px;margin:0 0 .45em}
ul.inc li::before{content:"✓";position:absolute;left:0;color:var(--accent-ink);font-weight:700}
.not{background:#f4f1fa;border-radius:10px;padding:12px 14px;font-size:.95rem;color:var(--soft);margin:0 0 16px}
.not b{color:var(--ink)}
.btn{display:inline-block;background:var(--accent-ink);color:#fff;text-decoration:none;font-weight:700;padding:13px 26px;border-radius:99px}
.btn:hover{background:#431f66}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;margin:0 0 28px}
.how h2{font-size:1.4rem}
.how ul{margin:0;padding-left:1.2em}
footer{padding:10px 0 40px;text-align:center;color:var(--soft);font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
@media (max-width:820px){.c-grid{grid-template-columns:1fr}.body{padding:20px 18px}.hero{padding:40px 0 34px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="../#/inicio"><span class="mark">LF</span><span>Luis Franco Serrano</span></a>
  <div class="lang" role="group" aria-label="Idioma">
    <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
    <button type="button" data-lang="ca" aria-pressed="false" lang="ca">CA</button>
  </div>
</div></header>

<section class="hero"><div class="wrap">
  <h1 id="h1"></h1>
  <p id="lead"></p>
  <div class="chips" id="chips"></div>
</div></section>

<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
(() => {
  'use strict';
  const T = {
    es: {
      title: 'Cursos online', lead: 'Material de estudio elaborado por un docente, con acceso online a mi campus, en castellano y catalán, desde el móvil o el ordenador.',
      price: 'Precio', access: '1 año de acceso desde la activación, ampliable', not: 'Lo que no es', contact: 'Pedir información o acceso',
      how: 'Cómo funciona', foot: '© Luis Franco Serrano',
      howList: ['Escríbeme por el formulario de contacto y te cuento cómo acceder.', 'Te doy de alta una cuenta personal en el campus (campus.luisfs.com) y recibes tu acceso.', 'Entras desde el móvil o el ordenador, sin instalar nada. Puedes cambiar entre castellano y catalán con un botón.', 'El acceso dura 1 año desde la activación y se puede ampliar.']
    },
    ca: {
      title: 'Cursos en línia', lead: 'Material d’estudi elaborat per un docent, amb accés en línia al meu campus, en castellà i català, des del mòbil o l’ordinador.',
      price: 'Preu', access: '1 any d’accés des de l’activació, ampliable', not: 'El que no és', contact: 'Demanar informació o accés',
      how: 'Com funciona', foot: '© Luis Franco Serrano',
      howList: ['Escriu-me pel formulari de contacte i t’explico com accedir-hi.', 'Et dono d’alta un compte personal al campus (campus.luisfs.com) i rebràs el teu accés.', 'Hi entres des del mòbil o l’ordinador, sense instal·lar res. Pots canviar entre castellà i català amb un botó.', 'L’accés dura 1 any des de l’activació i es pot ampliar.']
    }
  };
  const C = [
    { id: 'tcae', img: 'tcai', price: 39,
      es: { name: 'Temario TCAE oposiciones online', lead: 'Curso online para opositar a TCAE / TCAI, pensado sobre todo para la oposición del ICS (prueba tipo test). El temario sirve de base para otras convocatorias de auxiliar de enfermería.',
        inc: ['Temario completo: 7 temas y 62 apartados para leer online, con esquemas, tablas, avisos importantes y un resumen al final de cada apartado.', '114 avisos de «Salió en el examen» con preguntas de los exámenes oficiales del ICS de 2016, 2019 y 2024, colocados en su apartado.', 'Un test por apartado (62): cada intento saca 20 preguntas al azar de un banco grande, con más de 8.100 preguntas distintas por idioma.', 'Simulacro de examen de 60 preguntas, repartidas según el peso de cada tema.', '50 supuestos prácticos: casos de pacientes con 10 preguntas cada uno.', 'Unas 280 actividades dentro del temario que se corrigen solas, y simulaciones con explicación de cada respuesta.', '27 herramientas de estudio (escalas, diluciones, balance hídrico, checklists, odontograma…) y un planificador de estudio con la fecha de tu examen.'],
        not: 'No es una academia presencial ni incluye clases en directo. No sustituye la convocatoria ni la normativa vigentes, que conviene contrastar siempre. No garantiza plaza ni aprobar.' },
      ca: { name: 'Temari oposicions TCAE en línia', lead: 'Curs en línia per opositar a TCAE / TCAI, pensat sobretot per a l’oposició de l’ICS (prova tipus test). El temari serveix de base per a altres convocatòries d’auxiliar d’infermeria.',
        inc: ['Temari complet: 7 temes i 62 apartats per llegir en línia, amb esquemes, taules, avisos importants i un resum al final de cada apartat.', '114 avisos de «Va sortir a l’examen» amb preguntes dels exàmens oficials de l’ICS del 2016, 2019 i 2024, col·locats al seu apartat.', 'Un test per apartat (62): cada intent treu 20 preguntes a l’atzar d’un banc gran, amb més de 8.100 preguntes diferents per idioma.', 'Simulacre d’examen de 60 preguntes, repartides segons el pes de cada tema.', '50 supòsits pràctics: casos de pacients amb 10 preguntes cadascun.', 'Unes 280 activitats dins del temari que es corregeixen soles, i simulacions amb explicació de cada resposta.', '27 eines d’estudi (escales, dilucions, balanç hídric, checklists, odontograma…) i un planificador d’estudi amb la data del teu examen.'],
        not: 'No és una acadèmia presencial ni inclou classes en directe. No substitueix la convocatòria ni la normativa vigents, que convé contrastar sempre. No garanteix plaça ni aprovar.' } },
    { id: 'primers-auxilis', img: 'pa', price: 19,
      es: { name: 'Curso online de Primeros auxilios', lead: 'Para quien quiere aprender a actuar ante una emergencia con una base sólida: estudiantes de FP sanitaria o sociosanitaria, monitores, docentes, cuidadores, familias o cualquiera que quiera repasar.',
        inc: ['9 temas y 39 apartados de temario navegable, con imágenes, esquemas, tablas y avisos de lo importante.', '177 actividades dentro del temario que se corrigen al momento: ordenar pasos, relacionar, tarjetas y tests rápidos con explicación.', '11 simulaciones interactivas: RCP y DEA (adulto, niño y lactante), atragantamiento, llamada al 112, valoración ABCDE, triaje START, hemorragias, quemaduras, fracturas, intoxicaciones, casos clínicos y botiquín. Con pistas y nota sobre 10.', 'Un test de repaso por tema, con 40 preguntas al azar de un banco de 1.047 en total, con intentos ilimitados.', 'Examen final de 60 preguntas de todos los temas, con 75 minutos y hasta 3 intentos.'],
        not: 'No es un curso con prácticas con maniquí ni una titulación oficial o certificado acreditado. No sustituye la formación práctica ni los protocolos de tu centro o la normativa vigente.' },
      ca: { name: 'Curs en línia de Primers auxilis', lead: 'Per a qui vol aprendre a actuar davant d’una emergència amb una base sòlida: estudiants de FP sanitària o sociosanitària, monitors, docents, cuidadors, famílies o qualsevol que vulgui repassar.',
        inc: ['9 temes i 39 apartats de temari navegable, amb imatges, esquemes, taules i avisos del que és important.', '177 activitats dins del temari que es corregeixen a l’instant: ordenar passos, relacionar, targetes i tests ràpids amb explicació.', '11 simulacions interactives: RCP i DEA (adult, nen i lactant), ofec, trucada al 112, valoració ABCDE, triatge START, hemorràgies, cremades, fractures, intoxicacions, casos clínics i farmaciola. Amb pistes i nota sobre 10.', 'Un test de repàs per tema, amb 40 preguntes a l’atzar d’un banc de 1.047 en total, amb intents il·limitats.', 'Examen final de 60 preguntes de tots els temes, amb 75 minuts i fins a 3 intents.'],
        not: 'No és un curs amb pràctiques amb maniquí ni una titulació oficial o certificat acreditat. No substitueix la formació pràctica ni els protocols del teu centre o la normativa vigent.' } },
    { id: 'supervivencia', img: 'sv', price: 19,
      es: { name: 'Curso online de Supervivencia en emergencias', lead: 'Preparación y protección civil para personas y familias: qué riesgos hay donde vives, cómo te avisan, qué tener en casa, cómo decidir si te quedas o te vas y qué hacer los primeros minutos. Se apoya en fuentes y criterios oficiales (Protecció Civil, protección civil nacional, 112).',
        inc: ['23 temas y 102 apartados de temario navegable, con tablas, secuencias de pasos, esquemas y avisos de lo importante.', '235 actividades dentro del temario que se corrigen al momento, y una ficha resumen por apartado.', 'Un test de repaso por tema: 20 preguntas al azar de un banco de 100 (2.300 preguntas por idioma). Examen final de 60 preguntas.', '10 herramientas prácticas: cuaderno de preparación familiar, decisor «¿me quedo o me voy?», llamada al 112, botiquín y triaje, DEA, ictus e infarto, anafilaxia, agua, orientación y nudos.', 'Simulador-juego «Supervivent»: pones en práctica lo aprendido en una emergencia simulada (apagón, inundación, ola de calor…) con tu familia virtual, y recibes una nota con explicación de tus decisiones.'],
        not: 'No es formación presencial ni sustituye una formación práctica (primeros auxilios, RCP…). No sustituye las indicaciones de las autoridades ni al 112: ante un peligro real, llama y sigue sus instrucciones. No es una titulación.' },
      ca: { name: 'Curs en línia de Supervivència en emergències', lead: 'Preparació i protecció civil per a persones i famílies: quins riscos hi ha on vius, com t’avisen, què tenir a casa, com decidir si et quedes o marxes i què fer els primers minuts. Es recolza en fonts i criteris oficials (Protecció Civil, protecció civil nacional, 112).',
        inc: ['23 temes i 102 apartats de temari navegable, amb taules, seqüències de passos, esquemes i avisos del que és important.', '235 activitats dins del temari que es corregeixen a l’instant, i una fitxa resum per apartat.', 'Un test de repàs per tema: 20 preguntes a l’atzar d’un banc de 100 (2.300 preguntes per idioma). Examen final de 60 preguntes.', '10 eines pràctiques: quadern de preparació familiar, decisor «em quedo o marxo?», trucada al 112, farmaciola i triatge, DEA, ictus i infart, anafilaxi, aigua, orientació i nusos.', 'Simulador-joc «Supervivent»: poses en pràctica el que has après en una emergència simulada (apagada, inundació, onada de calor…) amb la teva família virtual, i reps una nota amb explicació de les teves decisions.'],
        not: 'No és formació presencial ni substitueix una formació pràctica (primers auxilis, RCP…). No substitueix les indicacions de les autoritats ni el 112: davant d’un perill real, truca i segueix les seves instruccions. No és una titulació.' } },
    { id: 'procediments', img: 'pr', price: 45,
      es: { name: 'Temario oposiciones Procedimientos Sanitarios (FP)', lead: 'Temario completo y online para la oposición al cuerpo de profesorado de Procedimientos Sanitarios y Asistenciales, pensado para la prueba de desarrollo: salen 4 bolas, eliges 1 y la desarrollas por escrito en 2 horas.',
        inc: ['Los 69 temas redactados, más un tema 0 sobre cómo desarrollar un tema (estructura, criterios y estrategia de redacción).', 'Cada tema en una página con índice, ideas clave, tablas, esquemas, normativa y datos, y una guía de cómo repartir las 2 horas del examen.', '6.417 preguntas de test de práctica repartidas en 69 cuestionarios (uno por tema), con revisión de las respuestas.', 'Entrenador de temas, simulacro de bolas (sorteo de 4 temas y reloj de 2 horas), detector de conceptos clave y revisor de redacción.', '27 simulaciones interactivas enlazadas a 41 temas, y un planificador de estudio por semanas y horas.'],
        not: 'No es una academia ni hay clases presenciales. No sustituye la convocatoria ni la normativa vigentes: contrástalas siempre (los criterios de referencia del material siguen el modelo de Madrid). No garantiza plaza ni aprobado.' },
      ca: { name: 'Temari oposicions Procediments Sanitaris (FP)', lead: 'Temari complet i en línia per a l’oposició al cos de professorat de Procediments Sanitaris i Assistencials, pensat per a la prova de desenvolupament: surten 4 boles, en tries 1 i la desenvolupes per escrit en 2 hores.',
        inc: ['Els 69 temes redactats, més un tema 0 sobre com desenvolupar un tema (estructura, criteris i estratègia de redacció).', 'Cada tema en una pàgina amb índex, idees clau, taules, esquemes, normativa i dades, i una guia de com repartir les 2 hores de l’examen.', '6.417 preguntes de test de pràctica repartides en 69 qüestionaris (un per tema), amb revisió de les respostes.', 'Entrenador de temes, simulacre de boles (sorteig de 4 temes i rellotge de 2 hores), detector de conceptes clau i revisor de redacció.', '27 simulacions interactives enllaçades a 41 temes, i un planificador d’estudi per setmanes i hores.'],
        not: 'No és una acadèmia ni hi ha classes presencials. No substitueix la convocatòria ni la normativa vigents: contrasta-les sempre (els criteris de referència del material segueixen el model de Madrid). No garanteix plaça ni aprovat.' } }
  ];

  let lang = 'es';
  try { const s = localStorage.getItem('lang'); if (s === 'ca' || s === 'es') lang = s; else if ((navigator.language || '').toLowerCase().startsWith('ca')) lang = 'ca'; } catch (_) {}
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title + ' · Luis Franco Serrano';
    $('h1').textContent = t.title; $('lead').textContent = t.lead;
    $('chips').innerHTML = C.map((c) => `<a class="chip" href="#${c.id}">${esc(c[lang].name)}</a>`).join('');
    $('app').innerHTML = C.map((c) => {
      const d = c[lang];
      return `<article class="course" id="${c.id}"><div class="c-grid">
        <div class="pics">
          <a href="img/${c.img}-1.jpg" target="_blank" rel="noopener"><img src="img/${c.img}-1.jpg" alt="${esc(d.name)}" width="1080" height="1080" loading="lazy"></a>
          <div class="thumbs">
            <a href="img/${c.img}-2.jpg" target="_blank" rel="noopener"><img src="img/${c.img}-2.jpg" alt="" width="1080" height="1080" loading="lazy"></a>
            <a href="img/${c.img}-3.jpg" target="_blank" rel="noopener"><img src="img/${c.img}-3.jpg" alt="" width="1080" height="1080" loading="lazy"></a>
          </div>
        </div>
        <div class="body">
          <h2>${esc(d.name)}</h2>
          <p class="lead">${esc(d.lead)}</p>
          <div class="price"><b>${c.price} €</b><span>${esc(t.access)}</span></div>
          <ul class="inc">${d.inc.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          <p class="not"><b>${esc(t.not)}:</b> ${esc(d.not)}</p>
          <a class="btn" href="../#/contacto">${esc(t.contact)}</a>
        </div></div></article>`;
    }).join('') + `<section class="how"><h2>${esc(t.how)}</h2><ul>${t.howList.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
    $('foot').textContent = t.foot;
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }
  document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (_) {} render();
  }));
  render();
})();
</script>
</body>
</html>
